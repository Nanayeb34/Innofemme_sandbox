# Runs on the VM from /opt/momo-sandbox. Secrets and settings come from /etc/momo-sandbox.env.
services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: /etc/momo-sandbox.env
    environment:
      SANDBOX_DATA_DIR: /data
    volumes:
      - /var/lib/momo-sandbox:/data
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    env_file: /etc/momo-sandbox.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
